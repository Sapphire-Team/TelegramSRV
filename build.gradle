plugins {
    id("com.github.johnrengelman.shadow") version "8.1.1"
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'net.weever'
version = project.mc_version.toString() + "-" + project.version.toString()
println version

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    implementation 'org.telegram:telegrambots:6.9.7.1'
    compileOnly("io.papermc.paper:paper-api:${mc_version}-R0.1-SNAPSHOT")
}

tasks {
    runServer {
        minecraftVersion(mc_version)
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    archiveBaseName = "TelegramSRV"
    archiveFileName = "TelegramSRV.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks {
    shadowJar {
        archiveBaseName.set("TelegramSRV")
        archiveVersion.set(version.toString())
        archiveClassifier.set("")
    }
}

tasks.register("buildShadow") {
    group = "build"
    description = "Cleans the project and builds the shadow JAR."

    dependsOn clean
    finalizedBy shadowJar

    doLast {
        println "Shadow JAR build completed."
    }
}

tasks.register("runServer1_20_1", xyz.jpenilla.runpaper.task.RunServer) {
    group = "run-paper"
    description = "Runs a Paper server for Minecraft 1.20.1 for legacy testing"
    minecraftVersion("1.20.1")
    runDirectory.set(file("runs/1.20.1"))

    dependsOn 'shadowJar'
    pluginJars.from(tasks.shadowJar)

    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
}

tasks.register("runServer1_21_1", xyz.jpenilla.runpaper.task.RunServer) {
    group = "run-paper"
    description = "Runs a Paper server for Minecraft 1.21.1 for modern testing"
    minecraftVersion("1.21.1")
    runDirectory.set(file("runs/1.21.1"))

    dependsOn 'shadowJar'
    pluginJars.from(tasks.shadowJar)

    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
}

tasks.register("runServer1_21_4", xyz.jpenilla.runpaper.task.RunServer) {
    group = "run-paper"
    description = "Runs a Paper server for Minecraft 1.21.4 for modern testing"
    minecraftVersion("1.21.4")
    runDirectory.set(file("runs/1.21.4"))

    dependsOn 'shadowJar'
    pluginJars.from(tasks.shadowJar)

    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('src/main/resources/lang') {
        include '**/*.yml'
    }
    def props = [version: version, api_version: api_version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

defaultTasks('clean', 'build', 'shadowJar')